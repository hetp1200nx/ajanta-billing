<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ajanta Paver Billing</title>
  <meta name="theme-color" content="#5b3417">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><img src="assets/logo.png" alt=""><div><b>Ajanta Paver</b><small>Billing</small></div></div>
      <nav id="sidenav"></nav>
      <div class="side-foot" id="sidefoot"></div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn back-btn" id="backBtn" aria-label="Back"></button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="top-actions" id="topActions"></div>
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"></button>
      </header>
      <main id="main"><div class="loading">Loading…</div></main>
    </div>
    <nav class="bottomnav" id="bottomnav"></nav>
  </div>
  <div id="printArea"></div>
  <dialog id="modal"></dialog>
  <div id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
